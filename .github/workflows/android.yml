name: Android build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Screenshots to log
        if: always()
        run: |
          for f in app/build/screenshots/0[126]_*.jpg; do
            [ -f "$f" ] || continue
            echo "SHOT-BEGIN $(basename "$f") $(stat -c %s "$f")"
            base64 -w 2000 "$f" | sed 's/^/SHOT /'
            echo "SHOT-END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-cockpit-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: swift-cockpit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
